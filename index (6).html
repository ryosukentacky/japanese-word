const cards=[{"number": 1, "name": "背徳感", "reading": "はいとくかん", "sections": [["導入", "「先輩、背徳感ですね。ちょっと字面が重いですけど、日常会話ではもっと軽い意味でも使いますよ。」"], ["A【要点｜まず全体を掴みましょう】", "一言でいうと、\n\n「やってはいけない・よくないと思っていることを、あえてやるときに感じる、罪悪感まじりのドキドキ」\n\nです。\n\n「罪悪感と同じ？」って思いました？\n\n……惜しいです。かなり近いんですけど、背徳感には『いけないことだからこそ妙に魅力的』という感覚が入りやすいんです。"], ["B【詳しい解説｜なぜ「背徳」なの？】", "「背徳」を分解してみましょう。\n\n背＝そむく\n徳＝道徳・正しいとされること\n\nつまり本来の「背徳」は、道徳に背くことです。\n\nそこから、\n\n「これはやっちゃダメ」\n↓\nでも、やってみたい\n↓\n実際にやってしまう\n↓\n「うわ、悪いことしてる……でもちょっと楽しい」\n\nこの独特な感覚が「背徳感」です。\n\nただし先輩、ここ大事ですよ。必ずしも本当に道徳に反するような重大な行為だけに使うわけじゃありません。\n\nたとえば、\n\n「ダイエット中なのに、夜中にラーメンを食べる背徳感」\n\nこれ、別に道徳違反じゃないですよね。\n\nでも自分の中にある**「本当はやめたほうがいい」**というルールを破っているので、日常的には「背徳感」と表現できます。"], ["C【イメージ理解｜一回、想像してみてください】", "先輩、夜11時です。\n\n「今日は健康のためにお菓子を食べない」\n\nって決めていました。\n\n……なのに冷蔵庫を開けたら、大きなケーキがあります。\n\n「いや、今日は食べないって決めたし……」\n\n冷蔵庫を閉める。\n\n……また開ける。\n\nそして結局、一口。\n\n「……うまい。」\n\nでも同時に、\n\n「こんな時間に食べてしまった……」\n\nとも思う。\n\nはい、この**「ダメだと思ってるのに、だからこそ妙においしく感じる」**感じ。\n\nこれが日常的な意味での「背徳感」です。"], ["D【具体例｜使い方を見ましょう】", "「深夜に食べるカップラーメンには背徳感がある。」\n\n→ 夜中に食べるのは健康的にはよくない。でも、その「やっちゃってる感」が妙に楽しい。\n\n「仕事を休んで、昼間からゲームをする背徳感。」\n\n→ 本来なら働いている時間。それなのに遊んでいる。その「いいのかな……」という感覚ですね。"], ["【似た言葉との違い】", "罪悪感（ざいあくかん）\n→ 「悪いことをしてしまった」という後ろめたさが中心。\n例：「友達に嘘をついて罪悪感を覚えた。」\n\n後ろめたさ（うしろめたさ）\n→ 人に知られたら困るような、心に引っかかる感じ。\n例：「親に黙って買ったことに後ろめたさがある。」\n\n背徳感（はいとくかん）\n→ 「いけないことをしている」という感覚に、誘惑・スリル・快感が混ざりやすい。\n例：「ダイエット中に食べるパフェの背徳感がすごい。」\n\n「罪悪感」は基本的に嫌な感情ですが、「背徳感」は文脈によってはちょっと楽しんでいるんです。\n\nここ、混ぜないでくださいね。"], ["【理解確認】", "「じゃあ先輩、3問だけです。」\n\nQ1. 背徳感を一言でいうと？\n→ 「いけないことをしているときの、罪悪感まじりのドキドキ」。\n\nQ2. 罪悪感との大きな違いは？\n→ 背徳感には「いけないからこそ魅力的」という感覚が入りやすい。\n\nQ3. 夜中にこっそりアイスを食べて『悪いことしてる感じがたまらない』。これは？\n→ 背徳感です。はい、ばっちりです。"], ["【30秒復習】", "① 読み方 → はいとくかん\n② 「背徳」→ 道徳・正しさに背くこと\n③ 中心イメージ → 「ダメなのに……だからこそ惹かれる」\n④ 罪悪感 → 後悔・申し訳なさが中心\n⑤ 背徳感 → 罪悪感＋誘惑・スリル・快感"], ["【一文で覚える】", "「背徳感＝『ダメだと分かっているのに……この感じ、ちょっとたまらない』」\n\n「はい。これで十分です。『悪いことをした気持ち』だけで覚えると罪悪感と区別できませんから、『ダメだからこそのドキドキ』までセットで覚えてくださいね。」"]], "original": "「先輩、背徳感ですね。ちょっと字面が重いですけど、日常会話ではもっと軽い意味でも使いますよ。」\n\nA【要点｜まず全体を掴みましょう】\n\n一言でいうと、\n\n「やってはいけない・よくないと思っていることを、あえてやるときに感じる、罪悪感まじりのドキドキ」\n\nです。\n\n「罪悪感と同じ？」って思いました？\n\n……惜しいです。かなり近いんですけど、背徳感には『いけないことだからこそ妙に魅力的』という感覚が入りやすいんです。\n\nB【詳しい解説｜なぜ「背徳」なの？】\n\n「背徳」を分解してみましょう。\n\n背＝そむく\n徳＝道徳・正しいとされること\n\nつまり本来の「背徳」は、道徳に背くことです。\n\nそこから、\n\n「これはやっちゃダメ」\n↓\nでも、やってみたい\n↓\n実際にやってしまう\n↓\n「うわ、悪いことしてる……でもちょっと楽しい」\n\nこの独特な感覚が「背徳感」です。\n\nただし先輩、ここ大事ですよ。必ずしも本当に道徳に反するような重大な行為だけに使うわけじゃありません。\n\nたとえば、\n\n「ダイエット中なのに、夜中にラーメンを食べる背徳感」\n\nこれ、別に道徳違反じゃないですよね。\n\nでも自分の中にある**「本当はやめたほうがいい」**というルールを破っているので、日常的には「背徳感」と表現できます。\n\nC【イメージ理解｜一回、想像してみてください】\n\n先輩、夜11時です。\n\n「今日は健康のためにお菓子を食べない」\n\nって決めていました。\n\n……なのに冷蔵庫を開けたら、大きなケーキがあります。\n\n「いや、今日は食べないって決めたし……」\n\n冷蔵庫を閉める。\n\n……また開ける。\n\nそして結局、一口。\n\n「……うまい。」\n\nでも同時に、\n\n「こんな時間に食べてしまった……」\n\nとも思う。\n\nはい、この**「ダメだと思ってるのに、だからこそ妙においしく感じる」**感じ。\n\nこれが日常的な意味での「背徳感」です。\n\nD【具体例｜使い方を見ましょう】\n\n「深夜に食べるカップラーメンには背徳感がある。」\n\n→ 夜中に食べるのは健康的にはよくない。でも、その「やっちゃってる感」が妙に楽しい。\n\n「仕事を休んで、昼間からゲームをする背徳感。」\n\n→ 本来なら働いている時間。それなのに遊んでいる。その「いいのかな……」という感覚ですね。\n\n【似た言葉との違い】\n\n罪悪感（ざいあくかん）\n→ 「悪いことをしてしまった」という後ろめたさが中心。\n例：「友達に嘘をついて罪悪感を覚えた。」\n\n後ろめたさ（うしろめたさ）\n→ 人に知られたら困るような、心に引っかかる感じ。\n例：「親に黙って買ったことに後ろめたさがある。」\n\n背徳感（はいとくかん）\n→ 「いけないことをしている」という感覚に、誘惑・スリル・快感が混ざりやすい。\n例：「ダイエット中に食べるパフェの背徳感がすごい。」\n\n「罪悪感」は基本的に嫌な感情ですが、「背徳感」は文脈によってはちょっと楽しんでいるんです。\n\nここ、混ぜないでくださいね。\n\n【理解確認】\n\n「じゃあ先輩、3問だけです。」\n\nQ1. 背徳感を一言でいうと？\n→ 「いけないことをしているときの、罪悪感まじりのドキドキ」。\n\nQ2. 罪悪感との大きな違いは？\n→ 背徳感には「いけないからこそ魅力的」という感覚が入りやすい。\n\nQ3. 夜中にこっそりアイスを食べて『悪いことしてる感じがたまらない』。これは？\n→ 背徳感です。はい、ばっちりです。\n\n【30秒復習】\n\n① 読み方 → はいとくかん\n② 「背徳」→ 道徳・正しさに背くこと\n③ 中心イメージ → 「ダメなのに……だからこそ惹かれる」\n④ 罪悪感 → 後悔・申し訳なさが中心\n⑤ 背徳感 → 罪悪感＋誘惑・スリル・快感\n\n【一文で覚える】\n\n「背徳感＝『ダメだと分かっているのに……この感じ、ちょっとたまらない』」\n\n「はい。これで十分です。『悪いことをした気持ち』だけで覚えると罪悪感と区別できませんから、『ダメだからこそのドキドキ』までセットで覚えてくださいね。」"}, {"number": 2, "name": "風刺", "reading": "ふうし", "sections": [["導入", "「先輩、風刺ですね。ニュース、漫画、小説なんかでかなり出てきます。単に『悪口を言うこと』ではないので、そこは最初に切り分けますよ。」"], ["A【要点｜まず全体を掴みましょう】", "一言でいうと、\n\n風刺＝社会や人物の問題点を、皮肉・笑い・たとえなどを使って遠回しに批判すること。\n\n「普通の批判と何が違うの？」って思いますよね。\n\nたとえば政治家に対して、\n\n「この政策は間違っている！」\n\nと直接言うのは批判。\n\n一方で、その政治家を「国民の財布からお金を吸い上げる掃除機」のように描いて、\n\n見た人に『ああ、この政策を批判してるんだな』と気づかせる。\n\nこれが風刺です。"], ["B【詳しい解説｜なぜわざわざ遠回しにするの？】", "「だったら普通に批判すればいいじゃないですか」って？\n\n……まあ、そう思いますよね。\n\nでも風刺には、直接言わないからこその強さがあります。\n\n社会に問題がある\n↓\nその問題をそのまま批判するのではなく、誇張・皮肉・笑いなどで表現する\n↓\n見る人が「これって現実の○○のことだ」と気づく\n↓\n笑ったり驚いたりしながら、問題について考える\n\nという流れです。\n\nだから風刺画なんかでは、政治家の特徴をわざと大げさに描いたりします。\n\n目的は単に笑わせることではありません。\n\n笑いや皮肉の奥に「これ、おかしくない？」という批判が隠れている。\n\nここが風刺の芯です。"], ["C【イメージ理解｜一回、想像してみてください】", "先輩の会社に、\n\n「経費を削減しろ！」\n\nと社員には厳しく言うのに、自分だけ豪華な社長室を作っている社長がいたとします。\n\nそこで漫画に、\n\n巨大な王様の椅子に座った社長が、社員に「無駄遣いは禁止！」と言っている\n\n場面を描く。\n\n……どうです？\n\n「この社長は矛盾している」と一言も書いてません。\n\nでも、\n\n「いや、お前が一番無駄遣いしてるじゃん」\n\nって伝わりますよね。\n\nはい。それが風刺です。"], ["D【具体例｜実際の使い方】", "「この漫画は現代の消費社会を風刺している。」\n\n→ 漫画の面白い表現を通して、消費社会の問題を批判している。\n\n「政治家を風刺したイラストが新聞に掲載された。」\n\n→ 政治家をそのまま批判するのではなく、誇張や皮肉を使って問題点を表現している。"], ["【似た言葉との違い】", "批判（ひはん）\n→ 問題点を指摘して評価する。風刺より直接的です。\n例：「政府の対応が遅いと批判した。」\n\n皮肉（ひにく）\n→ 表面上の言葉とは違う意味を込めたり、遠回しに相手の欠点を突いたりする。\n例：遅刻した人に「ずいぶん早い到着ですね」と言う。\n\n風刺（ふうし）\n→ 皮肉・笑い・誇張などを表現手段として使い、社会や人物の問題を批判する。\n例：「その映画は格差社会を風刺している。」\n\n「じゃあ皮肉と風刺は同じ？」\n\n……そこ、引っかかりやすいです。\n\n皮肉＝表現方法の一つ\n風刺＝その方法などを使って社会や人物を批判する表現\n\nくらいに分けると覚えやすいですよ。"], ["【理解確認】", "「はい、3問です。」\n\nQ1. 風刺とは？\n→ 皮肉・笑い・誇張などを使って、社会や人物の問題点を遠回しに批判すること。\n\nQ2. 普通の批判との違いは？\n→ 風刺は問題を直接指摘するのではなく、表現を工夫して気づかせることが多い。\n\nQ3. 社長だけ豪華な生活をしている会社を、王様にたとえて描くのは？\n→ 風刺です。"], ["【30秒復習】", "① 読み方 → ふうし\n② 何をする？ → 問題点を遠回しに批判する\n③ 何を使う？ → 皮肉・笑い・誇張・たとえ\n④ 批判との違い → 直接言わず、表現で気づかせる\n⑤ よく見る場所 → 風刺画・漫画・小説・映画・コメディなど"], ["【一文で覚える】", "「風刺＝『これ、おかしくない？』を皮肉や笑いに包んで見せること。」\n\n「はい。先輩は、**『風刺＝遠回しな社会批判』**をまず残してください。そこから『皮肉や笑いを使う』まで出てくれば十分です。」"]], "original": "「先輩、風刺ですね。ニュース、漫画、小説なんかでかなり出てきます。単に『悪口を言うこと』ではないので、そこは最初に切り分けますよ。」\n\nA【要点｜まず全体を掴みましょう】\n\n一言でいうと、\n\n風刺＝社会や人物の問題点を、皮肉・笑い・たとえなどを使って遠回しに批判すること。\n\n「普通の批判と何が違うの？」って思いますよね。\n\nたとえば政治家に対して、\n\n「この政策は間違っている！」\n\nと直接言うのは批判。\n\n一方で、その政治家を「国民の財布からお金を吸い上げる掃除機」のように描いて、\n\n見た人に『ああ、この政策を批判してるんだな』と気づかせる。\n\nこれが風刺です。\n\nB【詳しい解説｜なぜわざわざ遠回しにするの？】\n\n「だったら普通に批判すればいいじゃないですか」って？\n\n……まあ、そう思いますよね。\n\nでも風刺には、直接言わないからこその強さがあります。\n\n社会に問題がある\n↓\nその問題をそのまま批判するのではなく、誇張・皮肉・笑いなどで表現する\n↓\n見る人が「これって現実の○○のことだ」と気づく\n↓\n笑ったり驚いたりしながら、問題について考える\n\nという流れです。\n\nだから風刺画なんかでは、政治家の特徴をわざと大げさに描いたりします。\n\n目的は単に笑わせることではありません。\n\n笑いや皮肉の奥に「これ、おかしくない？」という批判が隠れている。\n\nここが風刺の芯です。\n\nC【イメージ理解｜一回、想像してみてください】\n\n先輩の会社に、\n\n「経費を削減しろ！」\n\nと社員には厳しく言うのに、自分だけ豪華な社長室を作っている社長がいたとします。\n\nそこで漫画に、\n\n巨大な王様の椅子に座った社長が、社員に「無駄遣いは禁止！」と言っている\n\n場面を描く。\n\n……どうです？\n\n「この社長は矛盾している」と一言も書いてません。\n\nでも、\n\n「いや、お前が一番無駄遣いしてるじゃん」\n\nって伝わりますよね。\n\nはい。それが風刺です。\n\nD【具体例｜実際の使い方】\n\n「この漫画は現代の消費社会を風刺している。」\n\n→ 漫画の面白い表現を通して、消費社会の問題を批判している。\n\n「政治家を風刺したイラストが新聞に掲載された。」\n\n→ 政治家をそのまま批判するのではなく、誇張や皮肉を使って問題点を表現している。\n\n【似た言葉との違い】\n\n批判（ひはん）\n→ 問題点を指摘して評価する。風刺より直接的です。\n例：「政府の対応が遅いと批判した。」\n\n皮肉（ひにく）\n→ 表面上の言葉とは違う意味を込めたり、遠回しに相手の欠点を突いたりする。\n例：遅刻した人に「ずいぶん早い到着ですね」と言う。\n\n風刺（ふうし）\n→ 皮肉・笑い・誇張などを表現手段として使い、社会や人物の問題を批判する。\n例：「その映画は格差社会を風刺している。」\n\n「じゃあ皮肉と風刺は同じ？」\n\n……そこ、引っかかりやすいです。\n\n皮肉＝表現方法の一つ\n風刺＝その方法などを使って社会や人物を批判する表現\n\nくらいに分けると覚えやすいですよ。\n\n【理解確認】\n\n「はい、3問です。」\n\nQ1. 風刺とは？\n→ 皮肉・笑い・誇張などを使って、社会や人物の問題点を遠回しに批判すること。\n\nQ2. 普通の批判との違いは？\n→ 風刺は問題を直接指摘するのではなく、表現を工夫して気づかせることが多い。\n\nQ3. 社長だけ豪華な生活をしている会社を、王様にたとえて描くのは？\n→ 風刺です。\n\n【30秒復習】\n\n① 読み方 → ふうし\n② 何をする？ → 問題点を遠回しに批判する\n③ 何を使う？ → 皮肉・笑い・誇張・たとえ\n④ 批判との違い → 直接言わず、表現で気づかせる\n⑤ よく見る場所 → 風刺画・漫画・小説・映画・コメディなど\n\n【一文で覚える】\n\n「風刺＝『これ、おかしくない？』を皮肉や笑いに包んで見せること。」\n\n「はい。先輩は、**『風刺＝遠回しな社会批判』**をまず残してください。そこから『皮肉や笑いを使う』まで出てくれば十分です。」"}, {"number": 3, "name": "皮肉", "reading": "ひにく", "sections": [["導入", "「先輩、さっきの**『風刺』とセットで覚えるとかなり分かりやすい**ですよ。皮肉は日常会話でもよく出てきます。」"], ["A【要点｜まず全体を掴みましょう】", "一言でいうと、\n\n皮肉＝表面上の言葉とは違う意味を込めて、遠回しに相手や物事を批判すること。\n\nたとえば、先輩が待ち合わせに30分遅刻したとします。\n\n後輩が、\n\n「先輩、今日はずいぶん早かったですね。」\n\nと言った。\n\n「え？ 遅かったのに？」\n\n……はい。だから皮肉なんです。\n\n本当に言いたいのは、\n\n「遅いですよ」\n\nですよね。\n\nつまり、\n\n表面：「早かったですね」\n↓\n本音：「めちゃくちゃ遅いですよ」\n\nこの表と裏のズレが重要です。"], ["B【詳しい解説｜どうして反対のことを言うの？】", "「普通に『遅い』って言えばいいじゃないですか？」\n\nまあ……そうなんですけど。\n\nあえて、\n\n「ずいぶん早かったですね」\n\nと言うことで、\n\n現実：30分遅刻している\n↓\nあえて逆の「早い」と言う\n↓\n現実との矛盾に相手が気づく\n↓\n「遅すぎる」という批判が強調される\n\nわけです。\n\nただし、皮肉は必ず「反対の言葉」を使うわけではありません。\n\nたとえば失敗ばかりしている人に、\n\n「さすがですね。」\n\nと言うのも、状況次第では皮肉になります。\n\n大事なのは、\n\n「言葉を文字どおり受け取ると、本当に伝えたい意味とズレている」\n\nというところです。"], ["C【イメージ理解｜一回、想像してください】", "先輩の部屋がものすごく散らかっています。\n\n床には服。\n\n机には空き缶。\n\nベッドにも物が山積み。\n\nそこに友達が来て、\n\n「いやー、相変わらず綺麗な部屋だね。」\n\n……先輩？\n\nここで、\n\n「ありがとう！」\n\nって喜んだらダメですよ。\n\n友達が本当に言いたいのは、\n\n「めちゃくちゃ汚いじゃん」\n\nです。\n\n言葉：綺麗ですね\n↕\n本音：汚いですね\n\nこのズレを利用して相手に伝える。\n\nこれが典型的な皮肉です。"], ["D【具体例｜実際の使い方】", "例①\n\nテストで全然勉強しなかった友達が0点を取った。\n\n「さすが、あれだけ勉強しなかっただけあるね。」\n\n→ 褒めているように見えて、実際には勉強しなかったことを指摘しています。\n\n例②\n\n何時間も会議したのに何も決まらなかった。\n\n「いやあ、本当に有意義な会議だったね。」\n\n→ 本音は、\n\n「何も決まらなくて無駄だった」\n\nですね。"], ["【風刺との違い】", "「先輩、さっきの（2）風刺とここでつなげますよ。」\n\n皮肉\n→ 言葉などに表面とは違う意味を込めて、遠回しに批判する。\n例：「30分遅刻とは、ずいぶん早いですね。」\n\n風刺\n→ 社会・政治・人物などの問題を、皮肉・笑い・誇張などを使って批判する表現。\n例：税金を大量に吸い込む掃除機として政治家を描く。\n\nつまり、\n\n皮肉＝批判などに使える「表現方法」\n風刺＝皮肉などを使った「社会・人物への批判表現」\n\nと考えると分かりやすいです。\n\n「じゃあ、風刺の中で皮肉が使われることもある？」\n\nはい。まさにそうです。"], ["【近い言葉】", "嫌味（いやみ）\n→ 相手を不快にさせるような、意地の悪い言い方。\n「そんなことも知らないんですね。」\n\n皮肉（ひにく）\n→ 表面的な言葉と本当に伝えたい意味をずらして批判することがある。\n「本当に仕事が早いですね」（実際には遅い）。\n\n風刺（ふうし）\n→ 社会などの問題を皮肉・笑い・誇張などで表現する。\n「政治家を豚として描いて金銭欲を批判する。」\n\n「皮肉＝嫌味」でもありませんよ。皮肉には、物事が予想と逆の結果になることを指す用法もあります。\n\nたとえば、\n\n「健康のために始めた運動でケガをするとは皮肉なものだ。」\n\nこれは誰かが嫌味を言っているわけではありません。\n\n**「目的とは反対の結果になってしまった」**という意味ですね。"], ["【理解確認】", "「はい、先輩。3問です。」\n\nQ1. 30分遅刻した人に『早かったですね』と言うのは？\n→ 皮肉。\n\nQ2. 皮肉と風刺の違いは？\n→ 皮肉は表現方法、風刺は皮肉などを使って社会や人物の問題を批判する表現。\n\nQ3. 『健康のために走り始めたのに、走ってケガをした。皮肉な結果だ』の皮肉は？\n→ 意図・期待とは反対の結果になったという意味です。"], ["【30秒復習】", "① 読み方 → ひにく\n② 基本 → 言葉の表面と本音をずらす\n③ 目的 → 遠回しな批判など\n④ 「皮肉な結果」→ 期待とは逆の結果\n⑤ 風刺との関係 → 風刺に皮肉が使われることがある"], ["【一文で覚える】", "「皮肉＝『いや、それ本当は逆の意味で言ってるよね？』という表現。」\n\n「はい。特に**『表面の意味 ↔ 本当に伝えたい意味』**というズレを覚えておいてください。風刺との区別もこれでかなり楽になりますよ。」"]], "original": "「先輩、さっきの**『風刺』とセットで覚えるとかなり分かりやすい**ですよ。皮肉は日常会話でもよく出てきます。」\n\nA【要点｜まず全体を掴みましょう】\n\n一言でいうと、\n\n皮肉＝表面上の言葉とは違う意味を込めて、遠回しに相手や物事を批判すること。\n\nたとえば、先輩が待ち合わせに30分遅刻したとします。\n\n後輩が、\n\n「先輩、今日はずいぶん早かったですね。」\n\nと言った。\n\n「え？ 遅かったのに？」\n\n……はい。だから皮肉なんです。\n\n本当に言いたいのは、\n\n「遅いですよ」\n\nですよね。\n\nつまり、\n\n表面：「早かったですね」\n↓\n本音：「めちゃくちゃ遅いですよ」\n\nこの表と裏のズレが重要です。\n\nB【詳しい解説｜どうして反対のことを言うの？】\n\n「普通に『遅い』って言えばいいじゃないですか？」\n\nまあ……そうなんですけど。\n\nあえて、\n\n「ずいぶん早かったですね」\n\nと言うことで、\n\n現実：30分遅刻している\n↓\nあえて逆の「早い」と言う\n↓\n現実との矛盾に相手が気づく\n↓\n「遅すぎる」という批判が強調される\n\nわけです。\n\nただし、皮肉は必ず「反対の言葉」を使うわけではありません。\n\nたとえば失敗ばかりしている人に、\n\n「さすがですね。」\n\nと言うのも、状況次第では皮肉になります。\n\n大事なのは、\n\n「言葉を文字どおり受け取ると、本当に伝えたい意味とズレている」\n\nというところです。\n\nC【イメージ理解｜一回、想像してください】\n\n先輩の部屋がものすごく散らかっています。\n\n床には服。\n\n机には空き缶。\n\nベッドにも物が山積み。\n\nそこに友達が来て、\n\n「いやー、相変わらず綺麗な部屋だね。」\n\n……先輩？\n\nここで、\n\n「ありがとう！」\n\nって喜んだらダメですよ。\n\n友達が本当に言いたいのは、\n\n「めちゃくちゃ汚いじゃん」\n\nです。\n\n言葉：綺麗ですね\n↕\n本音：汚いですね\n\nこのズレを利用して相手に伝える。\n\nこれが典型的な皮肉です。\n\nD【具体例｜実際の使い方】\n\n例①\n\nテストで全然勉強しなかった友達が0点を取った。\n\n「さすが、あれだけ勉強しなかっただけあるね。」\n\n→ 褒めているように見えて、実際には勉強しなかったことを指摘しています。\n\n例②\n\n何時間も会議したのに何も決まらなかった。\n\n「いやあ、本当に有意義な会議だったね。」\n\n→ 本音は、\n\n「何も決まらなくて無駄だった」\n\nですね。\n\n【風刺との違い】\n\n「先輩、さっきの（2）風刺とここでつなげますよ。」\n\n皮肉\n→ 言葉などに表面とは違う意味を込めて、遠回しに批判する。\n例：「30分遅刻とは、ずいぶん早いですね。」\n\n風刺\n→ 社会・政治・人物などの問題を、皮肉・笑い・誇張などを使って批判する表現。\n例：税金を大量に吸い込む掃除機として政治家を描く。\n\nつまり、\n\n皮肉＝批判などに使える「表現方法」\n風刺＝皮肉などを使った「社会・人物への批判表現」\n\nと考えると分かりやすいです。\n\n「じゃあ、風刺の中で皮肉が使われることもある？」\n\nはい。まさにそうです。\n\n【近い言葉】\n\n嫌味（いやみ）\n→ 相手を不快にさせるような、意地の悪い言い方。\n「そんなことも知らないんですね。」\n\n皮肉（ひにく）\n→ 表面的な言葉と本当に伝えたい意味をずらして批判することがある。\n「本当に仕事が早いですね」（実際には遅い）。\n\n風刺（ふうし）\n→ 社会などの問題を皮肉・笑い・誇張などで表現する。\n「政治家を豚として描いて金銭欲を批判する。」\n\n「皮肉＝嫌味」でもありませんよ。皮肉には、物事が予想と逆の結果になることを指す用法もあります。\n\nたとえば、\n\n「健康のために始めた運動でケガをするとは皮肉なものだ。」\n\nこれは誰かが嫌味を言っているわけではありません。\n\n**「目的とは反対の結果になってしまった」**という意味ですね。\n\n【理解確認】\n\n「はい、先輩。3問です。」\n\nQ1. 30分遅刻した人に『早かったですね』と言うのは？\n→ 皮肉。\n\nQ2. 皮肉と風刺の違いは？\n→ 皮肉は表現方法、風刺は皮肉などを使って社会や人物の問題を批判する表現。\n\nQ3. 『健康のために走り始めたのに、走ってケガをした。皮肉な結果だ』の皮肉は？\n→ 意図・期待とは反対の結果になったという意味です。\n\n【30秒復習】\n\n① 読み方 → ひにく\n② 基本 → 言葉の表面と本音をずらす\n③ 目的 → 遠回しな批判など\n④ 「皮肉な結果」→ 期待とは逆の結果\n⑤ 風刺との関係 → 風刺に皮肉が使われることがある\n\n【一文で覚える】\n\n「皮肉＝『いや、それ本当は逆の意味で言ってるよね？』という表現。」\n\n「はい。特に**『表面の意味 ↔ 本当に伝えたい意味』**というズレを覚えておいてください。風刺との区別もこれでかなり楽になりますよ。」"}, {"number": 4, "name": "ろくでもない", "reading": "ろくでもない", "sections": [["導入", "「先輩、**『ろくでもない』**ですね。これ、かなりよく使いますけど、意味を『悪い』だけで覚えると少し雑なんです。」"], ["A【要点｜まず全体を掴みましょう】", "一言でいうと、\n\nろくでもない＝まともではない・大した価値がない・どうしようもない。\n\n人にも、物にも、考えにも使えます。\n\nたとえば、\n\n「あいつは、ろくでもない男だ。」\n\nなら、\n\n「まともじゃない、信用できない、どうしようもない男だ」\n\nというかなり否定的な意味です。\n\n一方、\n\n「ろくでもないことを考えるな。」\n\nなら、\n\n「くだらないこと・よくないことを考えるな」\n\nという感じですね。"], ["B【詳しい解説｜「ろく」って何？】", "「先輩、『ろくでもない』のろくって数字の6だと思ってません？」\n\n……違いますからね。\n\nこの「ろく」は、漢字では**「碌」**などと書き、\n\nまとも・十分・満足できる状態\n\nというイメージを持っています。\n\nだから、\n\nろく ＋ でもない\n↓\nまともなものですらない\n↓\n大したものではない・まともではない\n\nとなります。\n\nちなみに、\n\n「ろくに勉強していない」\n\nの「ろく」もつながっています。\n\nこれは、\n\n「十分に・まともに勉強していない」\n\nということですね。"], ["C【イメージ理解｜一回、想像してください】", "先輩に友達が、\n\n「絶対儲かる方法がある！」\n\nと言ってきたとします。\n\n話を聞いてみると、\n\n「とりあえず100万円借りて全部ギャンブルに突っ込もう！」\n\n……。\n\n「先輩？」\n\n「それ、いいアイデアかも」とか言わないでくださいね？\n\nこういうまともに取り合う価値もないような考えに対して、\n\n「そんな、ろくでもない考えはやめなさい。」\n\nと言えます。\n\nつまり「悪い」だけじゃなく、\n\n「まともじゃない」「くだらない」「どうしようもない」\n\nという軽蔑や呆れが入るんです。"], ["D【具体例｜使い方を分けましょう】", "① 人\n\n「彼は仕事もせず、人からお金を借りてばかりのろくでもない男だ。」\n\n→ まともではない・信用できない人\n\n② 考え・行動\n\n「また、ろくでもないこと考えてるでしょう？」\n\n→ くだらない・よくないこと\n\n③ 物・内容\n\n「ろくでもない映画だった。」\n\n→ 質が低い・見る価値がない映画だった\n\nただし、かなり強い否定表現なので、人に直接使うと攻撃的になることがあります。"], ["【似た言葉との違い】", "「ここ、先輩が語彙を増やすなら一緒に覚えてください。」\n\nくだらない\n→ 価値がない・つまらないことに重点。\n例：「くだらない冗談はやめろ。」\n\nしょうもない\n→ 「くだらない」に近く、日常会話でかなり使う。\n例：「しょうもないことで喧嘩するなよ。」\n\nどうしようもない\n→ 改善するのが難しいほどひどい感じ。\n例：「何度注意されても同じことをする。どうしようもないやつだ。」\n\nろくでもない\n→ まともではなく、価値・品行・内容などが悪い。呆れや軽蔑を含みやすい。\n例：「ろくでもない連中と付き合うな。」\n\n「あれ？ 『くだらない』と同じじゃない？」\n\n完全には同じじゃないです。\n\nくだらない映画\n→ 面白くない・価値がない。\n\nろくでもない男\n→ 人間性や行動に問題がある。\n\n人の性質を強く否定するときは、ろくでもないがしっくり来る場面が多いですね。"], ["【理解確認】", "「はい、3問いきます。」\n\nQ1. 「ろくでもない男」とは？\n→ まともではない・どうしようもない男。\n\nQ2. 「ろくでもない考え」とは？\n→ くだらない、またはよくない考え。\n\nQ3. 「ろくに寝ていない」の『ろく』と関係ある？\n→ あります。「十分に・まともに」というイメージでつながっています。"], ["【30秒復習】", "① 読み方 → ろくでもない\n② 核イメージ → まともではない\n③ 人なら → どうしようもない・信用できない\n④ 物・考えなら → くだらない・価値がない・よくない\n⑤ 感情 → 呆れ・軽蔑を含みやすい"], ["【一文で覚える】", "「ろくでもない＝『まともに評価する気にもならないくらい、どうしようもない』」\n\n「はい。単なる『悪い』より、**『まともじゃない』**を中心に覚えてください。『ろくでもない男』って聞いた瞬間のニュアンスがかなり掴みやすくなりますよ。」"]], "original": "「先輩、**『ろくでもない』**ですね。これ、かなりよく使いますけど、意味を『悪い』だけで覚えると少し雑なんです。」\n\nA【要点｜まず全体を掴みましょう】\n\n一言でいうと、\n\nろくでもない＝まともではない・大した価値がない・どうしようもない。\n\n人にも、物にも、考えにも使えます。\n\nたとえば、\n\n「あいつは、ろくでもない男だ。」\n\nなら、\n\n「まともじゃない、信用できない、どうしようもない男だ」\n\nというかなり否定的な意味です。\n\n一方、\n\n「ろくでもないことを考えるな。」\n\nなら、\n\n「くだらないこと・よくないことを考えるな」\n\nという感じですね。\n\nB【詳しい解説｜「ろく」って何？】\n\n「先輩、『ろくでもない』のろくって数字の6だと思ってません？」\n\n……違いますからね。\n\nこの「ろく」は、漢字では**「碌」**などと書き、\n\nまとも・十分・満足できる状態\n\nというイメージを持っています。\n\nだから、\n\nろく ＋ でもない\n↓\nまともなものですらない\n↓\n大したものではない・まともではない\n\nとなります。\n\nちなみに、\n\n「ろくに勉強していない」\n\nの「ろく」もつながっています。\n\nこれは、\n\n「十分に・まともに勉強していない」\n\nということですね。\n\nC【イメージ理解｜一回、想像してください】\n\n先輩に友達が、\n\n「絶対儲かる方法がある！」\n\nと言ってきたとします。\n\n話を聞いてみると、\n\n「とりあえず100万円借りて全部ギャンブルに突っ込もう！」\n\n……。\n\n「先輩？」\n\n「それ、いいアイデアかも」とか言わないでくださいね？\n\nこういうまともに取り合う価値もないような考えに対して、\n\n「そんな、ろくでもない考えはやめなさい。」\n\nと言えます。\n\nつまり「悪い」だけじゃなく、\n\n「まともじゃない」「くだらない」「どうしようもない」\n\nという軽蔑や呆れが入るんです。\n\nD【具体例｜使い方を分けましょう】\n\n① 人\n\n「彼は仕事もせず、人からお金を借りてばかりのろくでもない男だ。」\n\n→ まともではない・信用できない人\n\n② 考え・行動\n\n「また、ろくでもないこと考えてるでしょう？」\n\n→ くだらない・よくないこと\n\n③ 物・内容\n\n「ろくでもない映画だった。」\n\n→ 質が低い・見る価値がない映画だった\n\nただし、かなり強い否定表現なので、人に直接使うと攻撃的になることがあります。\n\n【似た言葉との違い】\n\n「ここ、先輩が語彙を増やすなら一緒に覚えてください。」\n\nくだらない\n→ 価値がない・つまらないことに重点。\n例：「くだらない冗談はやめろ。」\n\nしょうもない\n→ 「くだらない」に近く、日常会話でかなり使う。\n例：「しょうもないことで喧嘩するなよ。」\n\nどうしようもない\n→ 改善するのが難しいほどひどい感じ。\n例：「何度注意されても同じことをする。どうしようもないやつだ。」\n\nろくでもない\n→ まともではなく、価値・品行・内容などが悪い。呆れや軽蔑を含みやすい。\n例：「ろくでもない連中と付き合うな。」\n\n「あれ？ 『くだらない』と同じじゃない？」\n\n完全には同じじゃないです。\n\nくだらない映画\n→ 面白くない・価値がない。\n\nろくでもない男\n→ 人間性や行動に問題がある。\n\n人の性質を強く否定するときは、ろくでもないがしっくり来る場面が多いですね。\n\n【理解確認】\n\n「はい、3問いきます。」\n\nQ1. 「ろくでもない男」とは？\n→ まともではない・どうしようもない男。\n\nQ2. 「ろくでもない考え」とは？\n→ くだらない、またはよくない考え。\n\nQ3. 「ろくに寝ていない」の『ろく』と関係ある？\n→ あります。「十分に・まともに」というイメージでつながっています。\n\n【30秒復習】\n\n① 読み方 → ろくでもない\n② 核イメージ → まともではない\n③ 人なら → どうしようもない・信用できない\n④ 物・考えなら → くだらない・価値がない・よくない\n⑤ 感情 → 呆れ・軽蔑を含みやすい\n\n【一文で覚える】\n\n「ろくでもない＝『まともに評価する気にもならないくらい、どうしようもない』」\n\n「はい。単なる『悪い』より、**『まともじゃない』**を中心に覚えてください。『ろくでもない男』って聞いた瞬間のニュアンスがかなり掴みやすくなりますよ。」"},{"number": 5, "name": "同病相憐れむ", "reading": "どうびょうあいあわれむ", "sections": [["導入", "「先輩、今回は**『同病相憐れむ』**ですね。読み方は『どうびょうあいあわれむ』です。\n\nこれ、病気の人同士が慰め合うことだけを意味すると思っていませんか？\n\n……ふふ、実はもっと広い意味で使うんですよ。順番に説明しますね。」"], ["A【要点｜まず全体を掴みましょう】", "**同病相憐れむ＝同じような苦しみや悩み、境遇にある人同士は、お互いの気持ちを理解し、同情し合うということ。**\n\n先輩、たとえば仕事で同じような失敗をした二人がいたとします。\n\n一人が「上司に怒られてつらかった」と話したとき、もう一人はどう感じるでしょう？\n\n……そうです。\n\n「自分も同じ経験をしたから、その気持ちが分かる」\n\nと思いやすいですよね。\n\nこのように、**共通する苦しみがあるからこそ、相手の気持ちを理解できる**というのが中心です。\n\nただし、必ずしも仲良くなることまで意味するわけではありません。"], ["B【詳しい解説｜なぜそういう意味になるの？】", "「先輩、まず言葉を分解してみましょう。」\n\n- **同病（どうびょう）**：同じ病気。転じて、同じ苦しみや境遇。\n- **相（あい）**：お互いに。\n- **憐れむ（あわれむ）**：相手の苦しみを気の毒に思い、同情する。\n\nつまり、文字どおりには「同じ病気の人同士が互いを憐れむ」ということです。\n\nでも、ここでいう「病」は比喩としても使われます。\n\nたとえば、同じように仕事で苦労している人たち。\n\n一人が悩みを打ち明けると、もう一人も自分の経験を思い出します。\n\nすると、\n\n**共通する苦しみがある**  \n↓  \n**相手の経験を自分の経験と重ねる**  \n↓  \n**相手のつらさを理解しやすくなる**  \n↓  \n**互いに同情する**\n\nという流れになるんです。\n\n「じゃあ、単に同じ趣味の人同士が仲良くなるのも同病相憐れむ？」\n\n……先輩、そこは違います。\n\nこの言葉は、**共通する苦しみや不遇な境遇**が重要なんです。"], ["C【イメージ理解｜一回、想像してみてください】", "先輩、職場で二人の社員が残業続きで疲れているとします。\n\nAさんが言います。\n\n「最近、毎日帰るのが遅くて、本当にしんどいんだよね。」\n\nするとBさんが、\n\n「分かるよ。俺も昨日、夜10時まで仕事だった。」\n\nと返します。\n\n二人は同じ苦労を経験しているからこそ、相手の気持ちがよく分かります。\n\nそこで第三者が、\n\n**「同病相憐れむというやつだね。」**\n\nと言うわけです。\n\n「なるほど、同じ苦労をしている者同士だから分かり合えるんですね」\n\nはい、その理解で大丈夫です。"], ["D【具体例｜実際の使い方】", "**例①：仕事**\n\n「リストラを経験した二人は、同病相憐れむように互いの苦労を語り合った。」\n\n→ 同じつらい経験があるため、相手の気持ちを理解し、同情し合っている。\n\n**例②：勉強**\n\n「試験に落ちた二人は、同病相憐れむ思いで互いを慰めた。」\n\n→ 同じ挫折を経験したからこそ、相手の悔しさが分かる。\n\n**例③：人間関係**\n\n「失恋した友人同士が同病相憐れむように励まし合っていた。」\n\n→ 同じような悲しみを抱えているため、共感し合っている。"], ["【似た言葉との違い】", "「先輩、ここは重要です。似た言葉でも、何に重点があるのか違いますから。」\n\n| 言葉 | 核となるイメージ | 例文 |\n|---|---|---|\n| **同病相憐れむ** | 同じ苦しみを持つ者同士が同情する | 「同じ境遇の二人は同病相憐れむ思いだった。」 |\n| **同情** | 相手の苦しみを気の毒に思う | 「事故に遭った友人に同情した。」 |\n| **共感** | 相手の感情や考えを理解し、同じように感じる | 「彼女の意見に深く共感した。」 |\n| **傷のなめ合い** | 似た境遇の者同士が慰め合うが、問題に向き合わないという否定的な含みがある | 「反省せず傷のなめ合いをしていた。」 |\n| **類は友を呼ぶ** | 似た性質の人同士が自然と集まる | 「趣味の似た仲間が集まる。類は友を呼ぶだね。」 |\n\n「じゃあ、『傷のなめ合い』と同じですか？」\n\nいいえ。\n\n**同病相憐れむ**は、同じ苦しみを持つ者同士の同情が中心です。\n\n一方、**傷のなめ合い**は、慰め合うだけで改善しようとしない、といった批判的な意味で使われることがあります。\n\nここを混同しないでくださいね。"], ["【理解確認】", "{@body const qs = [{q:\"「同病相憐れむ」の中心的な意味は？\",opts:[\"同じ趣味の人が集まること\",\"同じ苦しみを持つ人同士が同情すること\",\"他人の失敗を笑うこと\"],a:1,why:\"同じような苦しみや境遇があるからこそ、互いの気持ちを理解しやすいということですね。\"},{q:\"「同病」の「病」は、実際の病気だけを指しますか？\",opts:[\"はい、病気だけです\",\"いいえ、苦しみや境遇の比喩にもなります\"],a:1,why:\"仕事の苦労や失恋、挫折などにも使えます。\"},{q:\"「傷のなめ合い」との違いは？\",opts:[\"まったく同じ意味\",\"同病相憐れむは相互の同情が中心で、傷のなめ合いは批判的に使われることがある\"],a:1,why:\"単に慰め合うだけなのか、共通する苦しみへの同情なのかが違います。\"}]}\n{@body const [answers,setAnswers] = DIL.useState({})}\n<box border radius=\"xl\" padding={3} gap={3}>\n  「はい、3問です。答えを選んでみてください。ちゃんと覚えられたか確認しますよ。」\n  {#each qs as q,i}\n    <box key={i} gap={2}>\n      **Q{i+1}. {q.q}**\n      <radio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=>setAnswers(p=>({...p,[i]:Number(v)}))}>\n        {#each q.opts as opt,j}\n          <radio value={String(j)}>{opt}</radio>\n        {/each}\n      </radio-group>\n      {#if answers[i]!==undefined}\n        <box background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}>\n          <text color={answers[i]===q.a?\"success\":\"danger\"} weight=\"medium\">{answers[i]===q.a?\"正解です！\":\"惜しいです。もう一度確認しましょう。\"}</text>\n          <text size=\"sm\">{q.why}</text>\n        </box>\n      {/if}\n    </box>\n    {#if i<2}\n      <divider color=\"subtle\"/>\n    {/if}\n  {/each}\n</box>"], ["【30秒復習】", "「はい、先輩。最後にもう一度だけ整理しましょう。」\n\n① 読み方 → **どうびょうあいあわれむ**\n\n② 意味 → **同じ苦しみを持つ者同士が同情する**\n\n③ 「同病」→ **同じ苦しみ・境遇**\n\n④ 「相憐れむ」→ **互いに同情する**\n\n⑤ 核イメージ → **「自分もつらかったから、あなたの気持ちが分かる」**\n\n⑥ 注意点 → **単に似た人同士が集まることではない**"], ["【一文で覚える】", "**「同病相憐れむ＝同じ痛みを知っているからこそ、相手の痛みも分かる。」**\n\n「はい。先輩、これで5語目です。\n\nただの『仲間意識』ではなく、**共通する苦しみから生まれる同情**だということを覚えておいてくださいね。」"]], "original": "「先輩、今回は**『同病相憐れむ』**ですね。読み方は『どうびょうあいあわれむ』です。\n\nこれ、病気の人同士が慰め合うことだけを意味すると思っていませんか？\n\n……ふふ、実はもっと広い意味で使うんですよ。順番に説明しますね。」\n\n## A【要点｜まず全体を掴みましょう】\n\n**同病相憐れむ＝同じような苦しみや悩み、境遇にある人同士は、お互いの気持ちを理解し、同情し合うということ。**\n\n先輩、たとえば仕事で同じような失敗をした二人がいたとします。\n\n一人が「上司に怒られてつらかった」と話したとき、もう一人はどう感じるでしょう？\n\n……そうです。\n\n「自分も同じ経験をしたから、その気持ちが分かる」\n\nと思いやすいですよね。\n\nこのように、**共通する苦しみがあるからこそ、相手の気持ちを理解できる**というのが中心です。\n\nただし、必ずしも仲良くなることまで意味するわけではありません。\n\n## B【詳しい解説｜なぜそういう意味になるの？】\n\n「先輩、まず言葉を分解してみましょう。」\n\n- **同病（どうびょう）**：同じ病気。転じて、同じ苦しみや境遇。\n- **相（あい）**：お互いに。\n- **憐れむ（あわれむ）**：相手の苦しみを気の毒に思い、同情する。\n\nつまり、文字どおりには「同じ病気の人同士が互いを憐れむ」ということです。\n\nでも、ここでいう「病」は比喩としても使われます。\n\nたとえば、同じように仕事で苦労している人たち。\n\n一人が悩みを打ち明けると、もう一人も自分の経験を思い出します。\n\nすると、\n\n**共通する苦しみがある**  \n↓  \n**相手の経験を自分の経験と重ねる**  \n↓  \n**相手のつらさを理解しやすくなる**  \n↓  \n**互いに同情する**\n\nという流れになるんです。\n\n「じゃあ、単に同じ趣味の人同士が仲良くなるのも同病相憐れむ？」\n\n……先輩、そこは違います。\n\nこの言葉は、**共通する苦しみや不遇な境遇**が重要なんです。\n\n## C【イメージ理解｜一回、想像してみてください】\n\n先輩、職場で二人の社員が残業続きで疲れているとします。\n\nAさんが言います。\n\n「最近、毎日帰るのが遅くて、本当にしんどいんだよね。」\n\nするとBさんが、\n\n「分かるよ。俺も昨日、夜10時まで仕事だった。」\n\nと返します。\n\n二人は同じ苦労を経験しているからこそ、相手の気持ちがよく分かります。\n\nそこで第三者が、\n\n**「同病相憐れむというやつだね。」**\n\nと言うわけです。\n\n「なるほど、同じ苦労をしている者同士だから分かり合えるんですね」\n\nはい、その理解で大丈夫です。\n\n## D【具体例｜実際の使い方】\n\n**例①：仕事**\n\n「リストラを経験した二人は、同病相憐れむように互いの苦労を語り合った。」\n\n→ 同じつらい経験があるため、相手の気持ちを理解し、同情し合っている。\n\n**例②：勉強**\n\n「試験に落ちた二人は、同病相憐れむ思いで互いを慰めた。」\n\n→ 同じ挫折を経験したからこそ、相手の悔しさが分かる。\n\n**例③：人間関係**\n\n「失恋した友人同士が同病相憐れむように励まし合っていた。」\n\n→ 同じような悲しみを抱えているため、共感し合っている。\n\n## 【似た言葉との違い】\n\n「先輩、ここは重要です。似た言葉でも、何に重点があるのか違いますから。」\n\n| 言葉 | 核となるイメージ | 例文 |\n|---|---|---|\n| **同病相憐れむ** | 同じ苦しみを持つ者同士が同情する | 「同じ境遇の二人は同病相憐れむ思いだった。」 |\n| **同情** | 相手の苦しみを気の毒に思う | 「事故に遭った友人に同情した。」 |\n| **共感** | 相手の感情や考えを理解し、同じように感じる | 「彼女の意見に深く共感した。」 |\n| **傷のなめ合い** | 似た境遇の者同士が慰め合うが、問題に向き合わないという否定的な含みがある | 「反省せず傷のなめ合いをしていた。」 |\n| **類は友を呼ぶ** | 似た性質の人同士が自然と集まる | 「趣味の似た仲間が集まる。類は友を呼ぶだね。」 |\n\n「じゃあ、『傷のなめ合い』と同じですか？」\n\nいいえ。\n\n**同病相憐れむ**は、同じ苦しみを持つ者同士の同情が中心です。\n\n一方、**傷のなめ合い**は、慰め合うだけで改善しようとしない、といった批判的な意味で使われることがあります。\n\nここを混同しないでくださいね。\n\n## 【理解確認】\n\n{@body const qs = [{q:\"「同病相憐れむ」の中心的な意味は？\",opts:[\"同じ趣味の人が集まること\",\"同じ苦しみを持つ人同士が同情すること\",\"他人の失敗を笑うこと\"],a:1,why:\"同じような苦しみや境遇があるからこそ、互いの気持ちを理解しやすいということですね。\"},{q:\"「同病」の「病」は、実際の病気だけを指しますか？\",opts:[\"はい、病気だけです\",\"いいえ、苦しみや境遇の比喩にもなります\"],a:1,why:\"仕事の苦労や失恋、挫折などにも使えます。\"},{q:\"「傷のなめ合い」との違いは？\",opts:[\"まったく同じ意味\",\"同病相憐れむは相互の同情が中心で、傷のなめ合いは批判的に使われることがある\"],a:1,why:\"単に慰め合うだけなのか、共通する苦しみへの同情なのかが違います。\"}]}\n{@body const [answers,setAnswers] = DIL.useState({})}\n<box border radius=\"xl\" padding={3} gap={3}>\n  「はい、3問です。答えを選んでみてください。ちゃんと覚えられたか確認しますよ。」\n  {#each qs as q,i}\n    <box key={i} gap={2}>\n      **Q{i+1}. {q.q}**\n      <radio-group direction=\"col\" value={answers[i]===undefined?\"\":String(answers[i])} onChange={v=>setAnswers(p=>({...p,[i]:Number(v)}))}>\n        {#each q.opts as opt,j}\n          <radio value={String(j)}>{opt}</radio>\n        {/each}\n      </radio-group>\n      {#if answers[i]!==undefined}\n        <box background=\"surface-secondary\" padding={2} radius=\"md\" gap={1}>\n          <text color={answers[i]===q.a?\"success\":\"danger\"} weight=\"medium\">{answers[i]===q.a?\"正解です！\":\"惜しいです。もう一度確認しましょう。\"}</text>\n          <text size=\"sm\">{q.why}</text>\n        </box>\n      {/if}\n    </box>\n    {#if i<2}\n      <divider color=\"subtle\"/>\n    {/if}\n  {/each}\n</box>\n\n## 【30秒復習】\n\n「はい、先輩。最後にもう一度だけ整理しましょう。」\n\n① 読み方 → **どうびょうあいあわれむ**\n\n② 意味 → **同じ苦しみを持つ者同士が同情する**\n\n③ 「同病」→ **同じ苦しみ・境遇**\n\n④ 「相憐れむ」→ **互いに同情する**\n\n⑤ 核イメージ → **「自分もつらかったから、あなたの気持ちが分かる」**\n\n⑥ 注意点 → **単に似た人同士が集まることではない**\n\n## 【一文で覚える】\n\n**「同病相憐れむ＝同じ痛みを知っているからこそ、相手の痛みも分かる。」**\n\n「はい。先輩、これで5語目です。\n\nただの『仲間意識』ではなく、**共通する苦しみから生まれる同情**だということを覚えておいてくださいね。」"},{"number": 6, "name": "看過", "reading": "かんか", "sections": [["導入", "「先輩、今回は**『看過』**ですね。\n\nニュースやビジネスの場面で、特に『看過できない』という形でよく使われます。\n\nただ、これを単に『見逃す』と覚えるだけでは不十分です。**問題に気づいているのに、何もせず見過ごす**というニュアンスまで押さえておきましょう。」"], ["A【要点｜まず全体を掴みましょう】", "**看過＝問題や見逃してはいけない事柄を、見過ごしてそのままにすること。**\n\nたとえば、会社で不正な経費処理が発覚したとします。\n\nそれを知った上司が、何も対応しなかったらどうでしょう？\n\n「不正を看過した」と表現できます。\n\n反対に、\n\n**「この不正は看過できない」**\n\nと言えば、「この不正を見過ごすわけにはいかない」という強い意思を表します。\n\nここで覚えてほしいのは、次の3点です。\n\n- **看過する**：問題などを見過ごす。\n- **看過できない**：問題を見過ごすわけにはいかない。\n- **看過しがたい**：見過ごすことが難しい、容認できない。\n\n「先輩、『看過できない』は単に『気になる』程度の意味ではありませんよ。問題を重大だと捉えている表現なんです。」"], ["B【詳しい解説｜なぜそういう意味になるの？】", "「では、漢字から考えてみましょう。」\n\n**看（かん）＝見る、注意して見る**\n\n**過（か）＝通り過ぎる、やり過ごす**\n\nつまり、\n\n**看過＝見ながら通り過ぎる**\n\nというイメージです。\n\n先輩、ここで一つ質問です。\n\n「問題があると知っているのに、対応せず放置する」\n\nこれは看過でしょうか？\n\n……はい、そのとおりです。\n\nただし、注意してください。\n\n**看過は、必ずしも意図的に無視した場合だけを指すわけではありません。**\n\n重大さを十分に認識せず、結果として見過ごしてしまった場合にも使われます。\n\nでは、どういう流れで看過が起きるのでしょう？\n\n<box border radius=\"lg\" padding={3} align=\"center\" gap={1}>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} width=\"100%\" align=\"center\">\n    **問題や異常が存在する**\n  </box>\n  <icon name=\"arrow-down\" color=\"secondary\"/>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} width=\"100%\" align=\"center\">\n    **問題に気づく、または気づく機会がある**\n  </box>\n  <icon name=\"arrow-down\" color=\"secondary\"/>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} width=\"100%\" align=\"center\">\n    **重要性を軽視する・対応しない**\n  </box>\n  <icon name=\"arrow-down\" color=\"secondary\"/>\n  <box background=\"surface-tertiary\" radius=\"md\" padding={3} width=\"100%\" align=\"center\">\n    **問題を見過ごした状態になる**\n  </box>\n</box>\n\n「つまり、看過という言葉では、**本来なら注意を向けたり、対応したりすべき問題をそのままにした**という点が重要なんです。」"], ["C【イメージ理解｜一回、想像してみてください】", "「先輩、会社の経理担当者になったと想像してください。」\n\n毎月、請求書と銀行明細を照合しています。\n\nある日、同じ請求書に対して二重に支払いが行われている可能性を発見しました。\n\n金額は10万円です。\n\nでも担当者は、\n\n「まあ、忙しいし、今月はそのままでいいか……」\n\nと放置しました。\n\n翌月、上司がその事実を知って言います。\n\n**「こうしたミスを看過するわけにはいかない。」**\n\n先輩、この言葉にはどういう意味が込められていると思います？\n\n……\n\n「問題があるのに、何もしないまま放っておくことはできない」\n\nということですよね。\n\nはい、正解です。\n\nここで「看過できない」と言っているのは、単にミスを発見したからではありません。\n\n**ミスを重大な問題として捉え、見過ごしてはいけないと判断した**からなんです。"], ["D【具体例｜実際の使い方】", ""], ["例① 会社", "**「従業員による不正行為を看過することはできない。」**\n\n→ 不正行為を見過ごしたり、放置したりすることはできない。"], ["例② 政治・ニュース", "**「政府は、この問題を看過できないとして調査を開始した。」**\n\n→ 政府は問題を重大だと考え、見過ごさず対応することにした。"], ["例③ 日常生活", "**「友人へのいじめを看過するわけにはいかなかった。」**\n\n→ いじめを知りながら、そのまま見過ごすことはできなかった。"], ["例④ ビジネス", "**「小さなミスであっても、繰り返されるなら看過できない。」**\n\n→ 一度のミスは小さくても、繰り返されることを放置できない。\n\n「先輩、どの例も共通していますよね。**本来、見過ごしてはいけない問題がある**ということです。」"], ["【似た言葉との違い】", "「ここは少し丁寧に比較します。似た言葉でも、使う場面が違いますから。」\n\n| 言葉 | 核となるイメージ | 例文 |\n|---|---|---|\n| **看過（かんか）** | 問題を見過ごす | 「不正を看過できない。」 |\n| **黙認（もくにん）** | 知っていながら、表立って反対せず事実上認める | 「上司は部下の違反を黙認した。」 |\n| **放置（ほうち）** | 必要な対応をせず、そのままにする | 「故障した機械を放置した。」 |\n| **見落とす（みおとす）** | 気づくべきものに気づかない | 「資料の誤字を見落とした。」 |\n| **容認（ようにん）** | 問題や行為を許容する | 「会社はその行為を容認した。」 |\n| **看過と近い「見過ごす」** | 気づかず、または気づいても問題にせず通り過ぎる | 「小さな変化を見過ごした。」 |\n\n「先輩、特に**看過と黙認**は混同しやすいんです。」\n\n**看過**は「問題を見過ごすこと」が中心です。\n\n一方、**黙認**は「知っていながら、明確に反対せず事実上認めること」が中心です。\n\nたとえば、部下の不正を知っていた上司が、何も言わず続けさせていた場合は「黙認した」と表現できます。\n\nそして、その不正を問題として扱わなかったという点では「看過した」とも表現できます。\n\nつまり、重なる部分はありますが、完全に同じ意味ではないんです。"], ["【理解確認】", "「はい、先輩。ここまで理解できたか3問で確認しますよ。」\n\n{@body const qs=[{q:\"「看過できない」の意味は？\",opts:[\"問題を理解できない\",\"問題を見過ごすわけにはいかない\",\"問題を許可する\"],a:1,why:\"看過できないとは、問題をそのまま見過ごすことはできないという意味です。\"},{q:\"「黙認」と「看過」の違いは？\",opts:[\"黙認は知りながら事実上認めること、看過は問題を見過ごすこと\",\"まったく同じ意味\",\"看過は必ず許可を与えること\"],a:0,why:\"黙認は事実上認める点、看過は見過ごす点に重点があります。\"},{q:\"請求書の二重払いに気づきながら放置する行為は？\",opts:[\"看過に当たる\",\"必ず容認に当たる\",\"見落としにしか当たらない\"],a:0,why:\"問題に気づいていながら見過ごしているため、看過と表現できます。\"}]}\n{@body const [ans,setAns]=DIL.useState({})}\n<box border radius=\"xl\" padding={3} gap={3}>\n  {#each qs as q,i}\n    <box key={i} gap={2}>\n      **Q{i+1}. {q.q}**\n      <radio-group direction=\"col\" value={ans[i]===undefined?\"\":String(ans[i])} onChange={v=>setAns(p=>({...p,[i]:Number(v)}))}>\n        {#each q.opts as opt,j}\n          <radio value={String(j)}>{opt}</radio>\n        {/each}\n      </radio-group>\n      {#if ans[i]!==undefined}\n        <box background=\"surface-secondary\" radius=\"md\" padding={2} gap={1}>\n          <text color={ans[i]===q.a?\"success\":\"danger\"} weight=\"medium\">{ans[i]===q.a?\"正解です！\":\"惜しいです。もう一度確認しましょう。\"}</text>\n          <text size=\"sm\">{q.why}</text>\n        </box>\n      {/if}\n    </box>\n    {#if i<2}\n      <divider color=\"subtle\"/>\n    {/if}\n  {/each}\n</box>"], ["【30秒復習】", "「先輩、最後にもう一度だけ整理しましょう。」\n\n① 読み方 → **かんか**\n\n② 意味 → **問題などを見過ごすこと**\n\n③ 看過できない → **見過ごすわけにはいかない**\n\n④ 黙認との違い → **黙認は事実上認める、看過は見過ごす**\n\n⑤ 見落とすとの違い → **見落とすは気づかないこと、看過は問題を見過ごすこと**\n\n⑥ よく使う表現 → **「重大な問題を看過できない」**"], ["【一文で覚える】", "**「看過＝本来見過ごしてはいけない問題を、そのままにしてしまうこと。」**\n\n「先輩、特にニュースで『看過できない』という表現が出てきたら、**『これは重大な問題だから、見過ごすわけにはいかない』**と読み替えてみてください。\n\nはい、これで6語目です。今日も一つ、使える言葉が増えましたね。」"]], "original": "「先輩、今回は**『看過』**ですね。\n\nニュースやビジネスの場面で、特に『看過できない』という形でよく使われます。\n\nただ、これを単に『見逃す』と覚えるだけでは不十分です。**問題に気づいているのに、何もせず見過ごす**というニュアンスまで押さえておきましょう。」\n\n## A【要点｜まず全体を掴みましょう】\n\n**看過＝問題や見逃してはいけない事柄を、見過ごしてそのままにすること。**\n\nたとえば、会社で不正な経費処理が発覚したとします。\n\nそれを知った上司が、何も対応しなかったらどうでしょう？\n\n「不正を看過した」と表現できます。\n\n反対に、\n\n**「この不正は看過できない」**\n\nと言えば、「この不正を見過ごすわけにはいかない」という強い意思を表します。\n\nここで覚えてほしいのは、次の3点です。\n\n- **看過する**：問題などを見過ごす。\n- **看過できない**：問題を見過ごすわけにはいかない。\n- **看過しがたい**：見過ごすことが難しい、容認できない。\n\n「先輩、『看過できない』は単に『気になる』程度の意味ではありませんよ。問題を重大だと捉えている表現なんです。」\n\n## B【詳しい解説｜なぜそういう意味になるの？】\n\n「では、漢字から考えてみましょう。」\n\n**看（かん）＝見る、注意して見る**\n\n**過（か）＝通り過ぎる、やり過ごす**\n\nつまり、\n\n**看過＝見ながら通り過ぎる**\n\nというイメージです。\n\n先輩、ここで一つ質問です。\n\n「問題があると知っているのに、対応せず放置する」\n\nこれは看過でしょうか？\n\n……はい、そのとおりです。\n\nただし、注意してください。\n\n**看過は、必ずしも意図的に無視した場合だけを指すわけではありません。**\n\n重大さを十分に認識せず、結果として見過ごしてしまった場合にも使われます。\n\nでは、どういう流れで看過が起きるのでしょう？\n\n<box border radius=\"lg\" padding={3} align=\"center\" gap={1}>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} width=\"100%\" align=\"center\">\n    **問題や異常が存在する**\n  </box>\n  <icon name=\"arrow-down\" color=\"secondary\"/>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} width=\"100%\" align=\"center\">\n    **問題に気づく、または気づく機会がある**\n  </box>\n  <icon name=\"arrow-down\" color=\"secondary\"/>\n  <box background=\"surface-secondary\" radius=\"md\" padding={3} width=\"100%\" align=\"center\">\n    **重要性を軽視する・対応しない**\n  </box>\n  <icon name=\"arrow-down\" color=\"secondary\"/>\n  <box background=\"surface-tertiary\" radius=\"md\" padding={3} width=\"100%\" align=\"center\">\n    **問題を見過ごした状態になる**\n  </box>\n</box>\n\n「つまり、看過という言葉では、**本来なら注意を向けたり、対応したりすべき問題をそのままにした**という点が重要なんです。」\n\n## C【イメージ理解｜一回、想像してみてください】\n\n「先輩、会社の経理担当者になったと想像してください。」\n\n毎月、請求書と銀行明細を照合しています。\n\nある日、同じ請求書に対して二重に支払いが行われている可能性を発見しました。\n\n金額は10万円です。\n\nでも担当者は、\n\n「まあ、忙しいし、今月はそのままでいいか……」\n\nと放置しました。\n\n翌月、上司がその事実を知って言います。\n\n**「こうしたミスを看過するわけにはいかない。」**\n\n先輩、この言葉にはどういう意味が込められていると思います？\n\n……\n\n「問題があるのに、何もしないまま放っておくことはできない」\n\nということですよね。\n\nはい、正解です。\n\nここで「看過できない」と言っているのは、単にミスを発見したからではありません。\n\n**ミスを重大な問題として捉え、見過ごしてはいけないと判断した**からなんです。\n\n## D【具体例｜実際の使い方】\n\n### 例① 会社\n\n**「従業員による不正行為を看過することはできない。」**\n\n→ 不正行為を見過ごしたり、放置したりすることはできない。\n\n### 例② 政治・ニュース\n\n**「政府は、この問題を看過できないとして調査を開始した。」**\n\n→ 政府は問題を重大だと考え、見過ごさず対応することにした。\n\n### 例③ 日常生活\n\n**「友人へのいじめを看過するわけにはいかなかった。」**\n\n→ いじめを知りながら、そのまま見過ごすことはできなかった。\n\n### 例④ ビジネス\n\n**「小さなミスであっても、繰り返されるなら看過できない。」**\n\n→ 一度のミスは小さくても、繰り返されることを放置できない。\n\n「先輩、どの例も共通していますよね。**本来、見過ごしてはいけない問題がある**ということです。」\n\n## 【似た言葉との違い】\n\n「ここは少し丁寧に比較します。似た言葉でも、使う場面が違いますから。」\n\n| 言葉 | 核となるイメージ | 例文 |\n|---|---|---|\n| **看過（かんか）** | 問題を見過ごす | 「不正を看過できない。」 |\n| **黙認（もくにん）** | 知っていながら、表立って反対せず事実上認める | 「上司は部下の違反を黙認した。」 |\n| **放置（ほうち）** | 必要な対応をせず、そのままにする | 「故障した機械を放置した。」 |\n| **見落とす（みおとす）** | 気づくべきものに気づかない | 「資料の誤字を見落とした。」 |\n| **容認（ようにん）** | 問題や行為を許容する | 「会社はその行為を容認した。」 |\n| **看過と近い「見過ごす」** | 気づかず、または気づいても問題にせず通り過ぎる | 「小さな変化を見過ごした。」 |\n\n「先輩、特に**看過と黙認**は混同しやすいんです。」\n\n**看過**は「問題を見過ごすこと」が中心です。\n\n一方、**黙認**は「知っていながら、明確に反対せず事実上認めること」が中心です。\n\nたとえば、部下の不正を知っていた上司が、何も言わず続けさせていた場合は「黙認した」と表現できます。\n\nそして、その不正を問題として扱わなかったという点では「看過した」とも表現できます。\n\nつまり、重なる部分はありますが、完全に同じ意味ではないんです。\n\n## 【理解確認】\n\n「はい、先輩。ここまで理解できたか3問で確認しますよ。」\n\n{@body const qs=[{q:\"「看過できない」の意味は？\",opts:[\"問題を理解できない\",\"問題を見過ごすわけにはいかない\",\"問題を許可する\"],a:1,why:\"看過できないとは、問題をそのまま見過ごすことはできないという意味です。\"},{q:\"「黙認」と「看過」の違いは？\",opts:[\"黙認は知りながら事実上認めること、看過は問題を見過ごすこと\",\"まったく同じ意味\",\"看過は必ず許可を与えること\"],a:0,why:\"黙認は事実上認める点、看過は見過ごす点に重点があります。\"},{q:\"請求書の二重払いに気づきながら放置する行為は？\",opts:[\"看過に当たる\",\"必ず容認に当たる\",\"見落としにしか当たらない\"],a:0,why:\"問題に気づいていながら見過ごしているため、看過と表現できます。\"}]}\n{@body const [ans,setAns]=DIL.useState({})}\n<box border radius=\"xl\" padding={3} gap={3}>\n  {#each qs as q,i}\n    <box key={i} gap={2}>\n      **Q{i+1}. {q.q}**\n      <radio-group direction=\"col\" value={ans[i]===undefined?\"\":String(ans[i])} onChange={v=>setAns(p=>({...p,[i]:Number(v)}))}>\n        {#each q.opts as opt,j}\n          <radio value={String(j)}>{opt}</radio>\n        {/each}\n      </radio-group>\n      {#if ans[i]!==undefined}\n        <box background=\"surface-secondary\" radius=\"md\" padding={2} gap={1}>\n          <text color={ans[i]===q.a?\"success\":\"danger\"} weight=\"medium\">{ans[i]===q.a?\"正解です！\":\"惜しいです。もう一度確認しましょう。\"}</text>\n          <text size=\"sm\">{q.why}</text>\n        </box>\n      {/if}\n    </box>\n    {#if i<2}\n      <divider color=\"subtle\"/>\n    {/if}\n  {/each}\n</box>\n\n## 【30秒復習】\n\n「先輩、最後にもう一度だけ整理しましょう。」\n\n① 読み方 → **かんか**\n\n② 意味 → **問題などを見過ごすこと**\n\n③ 看過できない → **見過ごすわけにはいかない**\n\n④ 黙認との違い → **黙認は事実上認める、看過は見過ごす**\n\n⑤ 見落とすとの違い → **見落とすは気づかないこと、看過は問題を見過ごすこと**\n\n⑥ よく使う表現 → **「重大な問題を看過できない」**\n\n## 【一文で覚える】\n\n**「看過＝本来見過ごしてはいけない問題を、そのままにしてしまうこと。」**\n\n「先輩、特にニュースで『看過できない』という表現が出てきたら、**『これは重大な問題だから、見過ごすわけにはいかない』**と読み替えてみてください。\n\nはい、これで6語目です。今日も一つ、使える言葉が増えましたね。」"}];let filtered=cards.map((_,i)=>i),index=0,mode='A';const $=id=>document.getElementById(id);function group(title){if(title.startsWith('A【'))return 'A';if(title.startsWith('B【'))return 'B';if(title.startsWith('C【'))return 'C';if(title.startsWith('D【'))return 'D';return 'その他'}function draw(){if(!filtered.length){$('list').textContent='該当する単語がありません';$('content').textContent='';return}index=Math.min(index,filtered.length-1);let c=cards[filtered[index]];$('counter').textContent=`${index+1} / ${filtered.length} 語（全 ${cards.length} 語）`;$('list').replaceChildren(...filtered.map((v,i)=>{let b=document.createElement('button');b.className='pill '+(i===index?'active':'');b.textContent=`（${cards[v].number}）${cards[v].name}`;b.onclick=()=>{index=i;mode='A';draw()};return b}));$('num').textContent=`第 ${c.number} 語`;$('word').textContent=c.name;$('reading').textContent=c.reading;$('tabs').replaceChildren(...['A','B','C','D','その他','全文'].map(k=>{let b=document.createElement('button');b.className='tab '+(mode===k?'active':'');b.textContent=k;b.onclick=()=>{mode=k;draw()};return b}));$('all').onclick=()=>{mode='全文';draw()};let secs=mode==='全文'?c.sections:c.sections.filter(([t])=>group(t)===mode);$('sectiontitle').textContent=mode==='全文'?'原文全文':mode==='その他'?'類義語・理解確認・復習など':`${mode} の解説`;$('content').innerHTML=secs.map(([title,body])=>`<div style="margin-bottom:26px"><strong>${escapeHtml(title)}</strong><br>${escapeHtml(body).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</div>`).join('')||'この区分には文章がありません。';$('prev').disabled=index===0;$('next').disabled=index===filtered.length-1}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('search').oninput=e=>{let q=e.target.value.trim().toLowerCase();filtered=cards.map((c,i)=>c.name.toLowerCase().includes(q)||c.original.toLowerCase().includes(q)?i:-1).filter(i=>i>=0);index=0;draw()};$('prev').onclick=()=>{index--;mode='A';draw()};$('next').onclick=()=>{index++;mode='A';draw()};draw();
</script></body></html>
